name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # ⚠️ 数据仓的改动**不会**触发代码仓的 workflow：后台保存成功后，
  #    线上必须等一次重新构建，否则前台永远是旧快照。
  #    这条每小时一次的兜底重建就是「后台改完最终能上线」的保证；
  #    要立刻生效：Actions → Deploy to GitHub Pages → Run workflow，
  #    或向本仓发一个 repository_dispatch（event_type = data-updated）。
  schedule:
    - cron: '17 * * * *'
  repository_dispatch:
    types: [data-updated]
  workflow_dispatch:

# Pages 部署需要 id-token 用于 OIDC（deploy-pages 用它在环境上换取部署权限）
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署；新推送取消进行中的旧部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Verify & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts：跳过 esbuild 的 postinstall 版本校验，
      # 平台二进制包由 optionalDependencies 提供，无需该脚本。
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # UI 测试默认使用 Playwright Chromium；--with-deps 补齐 Ubuntu 运行库。
      # 浏览器按 package.json 的 playwright 版本安装，不依赖 runner 预装 Chrome。
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # 以下各步是本地一直在跑的质量门禁，部署前必须全绿，
      # 保证线上永远不会出现「编译通过但页面白屏」的版本。

      # 数据来自数据仓（两仓分离）。构建前同步一次，否则前台读到的永远是旧快照。
      # continue-on-error：一次网络抖动不该让站点发不出去；脚本内部会校验内容，
      # 校验不过就保留仓库里那份快照并告警，绝不写入坏数据。
      - name: Sync data from data repo
        run: npm run data:pull
        continue-on-error: true
      - name: Type check
        run: npm run typecheck

      # 数据完整性门禁：只对 error 失败（warning 仍允许）。检查的是
      # 上一步 data:pull 之后的快照；拉取失败时脚本会明确告警「本次用的是旧快照」。
      - name: Data quality check (strict)
        run: npm run check:data -- --strict

      # 纯解析 / 网络层测试，用注入的 fetch 夹具，不发真实请求
      - name: GameJolt import tests
        run: npm run test:gamejolt

      # 数据仓文档读写：必须保留 taxonomy 等未知顶层字段，不能被旧代码抹掉
      - name: Catalog document tests
        run: npm run test:catalog

      # CLI 退出码契约：无 error → 0，有 error → 1（合成夹具，不碰生产数据）
      - name: Data quality CLI tests
        run: npm run test:data-quality

      - name: Build browser extension
        run: npm run build:extension

      - name: Deep module self-test
        run: npm run selftest

      # 同一套 99 步真实浏览器点击测试；runner 自动启动 Vite、等待就绪并在结束时清理。
      # 失败必须阻断部署；截图与 Vite 日志在下一步上传。
      - name: UI click tests (real browser)
        run: npm run test:ui:ci

      - name: Upload UI test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-artifacts
          path: |
            .tmp/ui-shots
            .tmp/ui-ci-vite.log
          if-no-files-found: ignore
          retention-days: 7

      - name: SSR smoke test
        run: npm run smoke

      # 催资源的跨用户共享由 Supabase 提供。anon public key 本来就是公开的，
      # 因此放在 Actions Variables（不是 Secrets）里也可以；留空则构建出「本机模式」。
      # 变量在 GitHub → Settings → Secrets and variables → Actions → Variables 配置。
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # 仓库尚未开启 Pages 时自动开启，省去手动配置
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
