name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages 部署需要 id-token 用于 OIDC（deploy-pages 用它在环境上换取部署权限）
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署；新推送取消进行中的旧部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Verify & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts：跳过 esbuild 的 postinstall 版本校验，
      # 平台二进制包由 optionalDependencies 提供，无需该脚本。
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # 以下三步是本地一直在跑的质量门禁，部署前必须全绿，
      # 保证线上永远不会出现「编译通过但页面白屏」的版本。
      - name: Type check
        run: npm run typecheck

      - name: Deep module self-test
        run: npm run selftest

      - name: SSR smoke test
        run: npm run smoke

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # 仓库尚未开启 Pages 时自动开启，省去手动配置
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
