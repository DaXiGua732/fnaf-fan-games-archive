<!doctype html>
<html lang="zh-CN" data-mode="light" data-theme="miku">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 浏览器地址栏 / UA 主题色。放在脚本之前，脚本才能在首帧同步深色值 -->
    <meta id="theme-color-meta" name="theme-color" content="#fafaf8" />
    <!--
      首帧防闪白：构建时由 vite.config.ts 的 theme-boot 插件把
      src/themeBoot.ts 打包后内联到这里。不要在 HTML 里手写主题逻辑 ——
      它必须与 useTheme 共用同一份实现。
    -->
    <!--THEME_BOOT-->
    <title>FNAF FAN GAMES ARCHIVE</title>
    <meta name="description" content="Five Nights at Freddy's 粉丝游戏资源导航与分享站" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
