<!doctype html>
<html lang="zh-CN" data-mode="light" data-theme="miku">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 浏览器地址栏 / UA 主题色。放在脚本之前，脚本才能在首帧同步深色值 -->
    <meta id="theme-color-meta" name="theme-color" content="#fafaf8" />
    <!--
      在样式与 Vue 之前先应用主题，避免深色模式下首屏闪白。
      这里读取的 storage key 必须与 src/composables/useTheme.ts 保持一致。
    -->
    <script>
      (function () {
        // 与 src/utils/themeColor.ts 的推导保持等价：自定义色在首帧就要应用，
        // 不能等 Vue 挂载，否则会先闪一下默认色。
        var INK = [26, 26, 24]
        var PAPER = [250, 250, 248]
        var DARK_PAPER = [20, 20, 19]
        var INVERSE = [8, 8, 8]
        var DEFAULT_CUSTOM = '#7a5cff'

        function channelLuminance(channel) {
          var value = channel / 255
          return value <= 0.04045 ? value / 12.92 : Math.pow((value + 0.055) / 1.055, 2.4)
        }

        function luminance(rgb) {
          return (
            0.2126 * channelLuminance(rgb[0]) +
            0.7152 * channelLuminance(rgb[1]) +
            0.0722 * channelLuminance(rgb[2])
          )
        }

        function contrast(a, b) {
          var la = luminance(a)
          var lb = luminance(b)
          return (Math.max(la, lb) + 0.05) / (Math.min(la, lb) + 0.05)
        }

        function mix(base, target, amount) {
          return [
            Math.round(base[0] + (target[0] - base[0]) * amount),
            Math.round(base[1] + (target[1] - base[1]) * amount),
            Math.round(base[2] + (target[2] - base[2]) * amount),
          ]
        }

        function ensureContrast(base, target, background, min) {
          if (contrast(base, background) >= min) return base
          var low = 0
          var high = 1
          var best = mix(base, target, 1)
          for (var i = 0; i < 16; i += 1) {
            var mid = (low + high) / 2
            var candidate = mix(base, target, mid)
            if (contrast(candidate, background) >= min) {
              high = mid
              best = candidate
            } else {
              low = mid
            }
          }
          return best
        }

        function parseHex(value) {
          if (typeof value !== 'string') return null
          var raw = value.trim().replace(/^#/, '')
          if (!/^[0-9a-f]{3}([0-9a-f]{3})?$/i.test(raw)) return null
          if (raw.length === 3) {
            raw = raw.charAt(0) + raw.charAt(0) + raw.charAt(1) + raw.charAt(1) +
              raw.charAt(2) + raw.charAt(2)
          }
          return '#' + raw.toLowerCase()
        }

        function toRgb(hex) {
          return [
            parseInt(hex.slice(1, 3), 16),
            parseInt(hex.slice(3, 5), 16),
            parseInt(hex.slice(5, 7), 16),
          ]
        }

        function channels(rgb) {
          return rgb[0] + ' ' + rgb[1] + ' ' + rgb[2]
        }

        var storedMode = null
        var storedAccent = null
        var storedCustom = null
        try {
          storedMode = localStorage.getItem('fnaf-archive:theme-mode:v1')
          storedAccent = localStorage.getItem('fnaf-archive:theme-accent:v1')
          storedCustom = localStorage.getItem('fnaf-archive:theme-custom:v1')
        } catch (_error) {
          // localStorage 被禁用时按「跟随系统」处理
        }

        var modes = ['system', 'light', 'dark']
        var accents = ['miku', 'rin', 'len', 'luka', 'meiko', 'kaito', 'custom']
        var preference = modes.indexOf(storedMode) === -1 ? 'system' : storedMode
        var accent = accents.indexOf(storedAccent) === -1 ? 'miku' : storedAccent
        var systemDark = false
        try {
          systemDark =
            typeof window.matchMedia === 'function' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches
        } catch (_error) {
          systemDark = false
        }

        var resolved = preference === 'dark' || (preference === 'system' && systemDark)
          ? 'dark'
          : 'light'
        var root = document.documentElement
        root.dataset.mode = resolved
        root.dataset.theme = accent
        root.style.colorScheme = resolved

        if (accent === 'custom') {
          var surface = toRgb(parseHex(storedCustom) || DEFAULT_CUSTOM)
          var paper = resolved === 'dark' ? DARK_PAPER : PAPER
          var accentRgb = ensureContrast(surface, resolved === 'light' ? INK : PAPER, paper, 4.6)
          var bright = ensureContrast(surface, PAPER, INVERSE, 4.5)
          var onAccent = contrast(surface, INK) >= contrast(surface, PAPER) ? INK : PAPER
          root.style.setProperty('--accent-rgb', channels(accentRgb))
          root.style.setProperty('--accent-surface-rgb', channels(surface))
          root.style.setProperty('--accent-bright-rgb', channels(bright))
          root.style.setProperty('--on-accent-rgb', channels(onAccent))
        }

        var themeColor = document.querySelector('meta[name="theme-color"]')
        if (themeColor) {
          themeColor.setAttribute('content', resolved === 'dark' ? '#141413' : '#fafaf8')
        }
      })()
    </script>
    <title>FNAF FAN GAMES ARCHIVE</title>
    <meta name="description" content="Five Nights at Freddy's 粉丝游戏资源导航与分享站" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
